<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Editar Pet - Pata Tech Petshop</title>
    
    <!-- Puxa a fonte poppins lá do google pra deixar a letra do jeito que queremos  -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- aqui avisa pro HTML onde encontrar o arquivo 'style.css'-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container">
      <h1>🐾 Editar Pet 🐾</h1>
      <p>Altere os dados do pet selecionado.</p>

      <!-- O formulário! Quando a gente clica em salvar, ele manda os novos dados escondidos (method="POST") lá pra rota '/editar/numero-do-pet' do nosso Python -->
      <form action="/editar/{{ pet.id }}" method="POST">
        
        <!-- Aqui pega o nome do pet que já estava lá no banco de dados e coloca dentro da caixinha. Assim a gente só altera o que quiser sem precisar digitar tudo do zero -->
        <input type="text" name="nome" value="{{ pet.nome }}" placeholder="Nome do Pet" required />
        <input type="text" name="especie" value="{{ pet.especie }}" placeholder="Espécie" required />
        <input type="text" name="raca" value="{{ pet.raca }}" placeholder="Raça" required />

        <!-- Aqui a gente usa um pouquinho de lógica (Jinja) dentro do HTML. Ele checa: se o sexo salvo no banco era 'Macho', ele já deixa essa opção pré-marcada (selected) pra gente na tela. -->
        <select name="sexo" required>
          <option value="Macho" {% if pet.sexo == 'Macho' %}selected{% endif %}>Macho</option>
          <option value="Fêmea" {% if pet.sexo == 'Fêmea' %}selected{% endif %}>Fêmea</option>
        </select>

        <input type="number" step="0.1" name="kilos" value="{{ pet.kilos }}" placeholder="Peso (kg)" required />
        
        <!-- Botão que pega tudo que tá nas caixinhas e envia de volta pro app.py  pra atualizar o banco -->
        <button type="submit">Salvar Alterações</button>
      </form>

      <!-- Botãozinho simples de voltar para pagina incial sabe -->
      <a href="{{ url_for('inicio') }}" class="btn-voltar">⬅️ Voltar para a página inicial</a>
    </div>
  </body>
</html>
